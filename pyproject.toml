[project]
name = "ajaanai"
version = "0.2.0"
description = "Converse by phone with a model trained on the teachings of Thanissaro Bhikkhu (Ajaan Geoff)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "anthropic>=0.40",
    "numpy>=1.26",
    "fastapi>=0.110",
    "modal>=1.0",
]

# GPU-side packages (vllm, unsloth, faster-whisper, sentence-transformers) are pinned in the
# Modal images in src/ajaanai/modal_app.py, not installed locally.

[project.scripts]
ajaanai = "ajaanai.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ajaanai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
